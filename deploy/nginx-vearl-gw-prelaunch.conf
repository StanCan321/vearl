# PRE-LAUNCH variant of /gw/ : the job-creation page is complete and shows the kinds of work, but nobody can create a job yet and nothing talks to a
# gateway. /gw/info and the digit samples are fixed files (deploy/gateway/prelaunch/, published under /var/www/vearl/gw-static/), the list of jobs is
# empty, and any attempt to create a job gets a clear refusal. Installed as /etc/nginx/snippets/vearl-gw.conf by deploy-site.sh --nginx.
location = /gw/info {
    alias /var/www/vearl/gw-static/info.json;
    default_type application/json;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Strict-Transport-Security "max-age=15552000" always;
}
location = /gw/samples/digits {
    alias /var/www/vearl/gw-static/digits.json;
    default_type application/json;
    add_header Cache-Control "public, max-age=3600" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Strict-Transport-Security "max-age=15552000" always;
}
location = /gw/recent {
    default_type application/json;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
    return 200 '{"jobs":[]}';
}
location ^~ /gw/ {
    default_type application/json;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
    return 503 '{"error":"Job creation opens when the testnet starts."}';
}
