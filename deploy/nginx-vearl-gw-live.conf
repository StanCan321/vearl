# LIVE variant of /gw/ : the job gateway (deploy/gateway/vearl-gateway.py, the PUBLIC one: deploy/systemd/vearl-gateway.service) on 127.0.0.1:18610. Installed as /etc/nginx/snippets/vearl-gw.conf by
# `deploy-site.sh --nginx --gw-live`, only once the gateway runs against the public network (funded wallet key, real workers).
# job gateway behind the free "create a job" site (/compute/): deploy/gateway/vearl-gateway.py on 127.0.0.1:18610.
# GET and POST only, tiny bodies. The gateway sees the visitor's address in X-Real-IP (it keeps only a salted hash, in memory).
# Until it runs, /compute/ shows "The job service is offline" (nginx answers 502).
location ^~ /gw/ {
    limit_req zone=vearl_gw burst=20 nodelay;
    limit_except GET POST { deny all; }
    client_max_body_size 200k;
    proxy_pass http://127.0.0.1:18610;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header X-Real-IP $remote_addr;
    proxy_read_timeout 20s;
    proxy_hide_header Cache-Control;
    proxy_hide_header X-Content-Type-Options;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Strict-Transport-Security "max-age=15552000" always;
}

