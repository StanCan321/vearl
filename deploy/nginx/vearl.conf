# TLS reverse proxy in front of the API/explorer (127.0.0.1:8545) and the faucet (127.0.0.1:8081).
# The built-in HTTP server has NEITHER TLS NOR per-client rate limiting: this file provides them.
limit_req_zone $binary_remote_addr zone=vearl_api:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=vearl_faucet:10m rate=1r/m;

server {
    listen 443 ssl http2;
    server_name testnet.example.org;                      # <- to be replaced
    ssl_certificate     /etc/letsencrypt/live/testnet.example.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/testnet.example.org/privkey.pem;

    client_max_body_size 2m;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location / {
        limit_req zone=vearl_api burst=40 nodelay;
        proxy_pass http://127.0.0.1:8545;
        proxy_read_timeout 10s;
    }
    location = /drip {
        limit_req zone=vearl_faucet burst=3 nodelay;
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header X-Real-IP $remote_addr;         # (the faucet does NOT use this header: see the runbook)
    }
    location = /faucet {
        proxy_pass http://127.0.0.1:8081/;
    }
}
