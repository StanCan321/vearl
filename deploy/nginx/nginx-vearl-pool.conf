# Vearl pool website: static page + the pool's read-only statistics API (127.0.0.1:8650)
limit_req_zone $binary_remote_addr zone=poolapi:10m rate=20r/s;
# micro-cache in front of the pool's statistics server (it takes 64 connections at a time): a crowd of visitors costs one request per URL every 2 seconds
proxy_cache_path /var/cache/nginx/vearl-pool levels=1:2 keys_zone=poolmicro:10m max_size=100m inactive=2m use_temp_path=off;

server {
    server_name pool.vearl.org _;
    server_tokens off;
    root /var/www/vearl-pool;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 512;

    add_header Strict-Transport-Security "max-age=15552000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'" always;

    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache" always;
        add_header Strict-Transport-Security "max-age=15552000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }
    location /assets/ {
        add_header Cache-Control "public, max-age=3600" always;
        add_header Strict-Transport-Security "max-age=15552000" always;
        add_header X-Content-Type-Options "nosniff" always;
    }
    location /fonts/ {
        add_header Cache-Control "public, max-age=2592000, immutable" always;
        add_header Strict-Transport-Security "max-age=15552000" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # the pool's statistics: read only, GET only, rate limited
    location /api/ {
        limit_except GET { deny all; }
        limit_req zone=poolapi burst=40 nodelay;
        proxy_pass http://127.0.0.1:8650;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 15s;
        proxy_cache poolmicro;
        proxy_cache_key "pool$uri$is_args$args";
        proxy_cache_valid 200 2s;
        proxy_cache_lock on;
        proxy_cache_lock_timeout 10s;
        proxy_cache_use_stale error timeout updating http_429 http_500 http_502 http_503;
        proxy_ignore_headers Cache-Control Expires Set-Cookie;
        proxy_hide_header Cache-Control;
        add_header X-Cache $upstream_cache_status always;
        add_header Cache-Control "no-store" always;
        add_header Strict-Transport-Security "max-age=15552000" always;
        add_header X-Content-Type-Options "nosniff" always;
    }
    location = /health {
        proxy_pass http://127.0.0.1:8650/health;
        add_header Cache-Control "no-store" always;
        add_header Strict-Transport-Security "max-age=15552000" always;
    }

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/pool.vearl.org/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/pool.vearl.org/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}


server {
    if ($host = pool.vearl.org) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80 default_server;
    listen [::]:80 default_server;
    server_name pool.vearl.org _;
    return 301 https://pool.vearl.org$request_uri; # every other name (the bare IP address) goes to the official address


}