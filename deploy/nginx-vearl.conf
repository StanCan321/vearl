# Vearl website, served from /var/www/vearl (install: deploy/deploy-site.sh --nginx)
# vearl.org is served over HTTPS (Let's Encrypt, certbot --webroot); the bare IP stays on plain HTTP.

# request limit for the explorer's API (shared by every server block, see vearl-locations.conf)
limit_req_zone $binary_remote_addr zone=vearl_api:10m rate=20r/s;
# request limit for the job gateway (the gateway has its own per-visitor quota on top)
limit_req_zone $binary_remote_addr zone=vearl_gw:10m rate=5r/s;
limit_req_zone $binary_remote_addr zone=vearl_faucet:10m rate=1r/m;
# micro-cache in front of the node's API and of the job gateway (see vearl-locations.conf): a crowd of visitors costs one request per second and URL
proxy_cache_path /var/cache/nginx/vearl levels=1:2 keys_zone=vearl_micro:20m max_size=200m inactive=2m use_temp_path=off;

# plain HTTP on the IP address (and any unknown host)
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    include /etc/nginx/snippets/vearl-locations.conf;
}

# plain HTTP on the domain: same host over HTTPS (the ACME challenge stays reachable)
server {
    listen 80;
    listen [::]:80;
    server_name vearl.org www.vearl.org;
    location ^~ /.well-known/acme-challenge/ { root /var/www/letsencrypt; default_type text/plain; }
    location / { return 301 https://$host$request_uri; }
}

# mail.vearl.org is only the mail server's name: it needs plain HTTP for the certificate challenge, and sends visitors to the site
server {
    listen 80;
    listen [::]:80;
    server_name mail.vearl.org;
    location ^~ /.well-known/acme-challenge/ { root /var/www/letsencrypt; default_type text/plain; }
    location / { return 301 https://vearl.org/; }
}

# the site over HTTPS on both names. No www -> apex redirect: some DNS caches (e.g. an ISP box that remembered "no such domain"
# for the apex before the record existed) resolve one name and not the other, and a redirect would send them to the broken one.
# The canonical address is declared in the pages (<link rel="canonical" href="https://vearl.org/...">).
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name vearl.org www.vearl.org;
    ssl_certificate /etc/letsencrypt/live/vearl.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vearl.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    include /etc/nginx/snippets/vearl-locations.conf;
    # unlisted preview pages (deploy/private-explorer/deploy.sh writes /etc/nginx/vearl-private/preview.conf): kept here so that
    # reinstalling this file with --nginx does not remove them; no file = nothing included
    include /etc/nginx/vearl-private/*.conf;

    # visitor statistics: a GoAccess report rebuilt every 10 minutes from the access log (deploy/stats/).
    # HTTPS only (never on the plain-HTTP IP address), behind a password, and not for search engines.
    location = /stats { return 301 /stats/; }
    location ^~ /stats/ {
        alias /var/www/vearl-stats/;
        index index.html;
        auth_basic "Vearl statistics";
        auth_basic_user_file /etc/nginx/vearl-stats.htpasswd;
        add_header Cache-Control "no-store" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Strict-Transport-Security "max-age=15552000" always;
        # the GoAccess page carries its own inline script and style and builds its tables with generated code (new Function):
        # this password-protected location has its own policy (nothing can load from or connect to anywhere else)
        add_header Content-Security-Policy "default-src 'none'; script-src 'unsafe-inline' 'unsafe-eval'; style-src 'unsafe-inline'; img-src data:; font-src 'self' data:; connect-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    }
}
