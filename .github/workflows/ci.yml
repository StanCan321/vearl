name: ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    name: build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        working-directory: vearl-core
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: vearl-core
      # CPU build: the GPU kernels need a CUDA toolkit and a card, they are tested by hand (docs/15 section 3)
      - name: build
        run: cargo build --release --bins
      - name: test
        run: cargo test --release --no-fail-fast
