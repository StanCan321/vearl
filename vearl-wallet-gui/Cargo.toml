[package]
name = "vearl-wallet-gui"
version = "0.1.0"
edition = "2021"
description = "Vearl wallet with a graphical interface (Windows and Linux): same keystore, same commands as vearl-wallet"
license = "Apache-2.0"
homepage = "https://vearl.org"
publish = false

[[bin]]
name = "vearl-wallet-gui"
path = "src/main.rs"

[dependencies]
# the wallet library (keystore, addresses, signatures) and the network client are the ones of the command-line wallet
vearl-core = { path = "../vearl-core" }
eframe = { version = "0.36", default-features = false, features = ["glow", "x11", "wayland"] }
qrcode = { version = "0.14", default-features = false }
serde_json = "1"
bip39 = { version = "2", features = ["zeroize"] }
zeroize = "1"
blake3 = "1"
rand = "0.8"
raw-window-handle = "0.6"
png = "0.18"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "0.26"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[features]
# Screenshots of every screen with demo data (design work only): ABSENT from release builds.
devshots = []

[profile.release]
opt-level = 3
lto = "thin"
